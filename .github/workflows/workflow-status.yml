name: Workflow Status Check

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_run:
    workflows: ["Android CI", "PR Checks", "Code Quality", "Performance Monitoring"]
    types: [completed]

jobs:
  check-workflows:
    name: Check All Workflows Status
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check workflow status
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const sha = context.sha;
          
          // Get all check runs for this commit
          const { data: checkRuns } = await github.rest.checks.listForRef({
            owner,
            repo,
            ref: sha,
            per_page: 100
          });
          
          console.log(`Found ${checkRuns.check_runs.length} check runs for commit ${sha}`);
          
          const workflowChecks = checkRuns.check_runs.filter(run => 
            run.name.includes('Android CI') || 
            run.name.includes('Code Quality') || 
            run.name.includes('Performance') ||
            run.name.includes('PR Checks')
          );
          
          let allPassed = true;
          let statusReport = "## 🔍 Workflow Status Report\n\n";
          
          for (const check of workflowChecks) {
            const status = check.conclusion || check.status;
            const emoji = status === 'success' ? '✅' : 
                         status === 'failure' ? '❌' : 
                         status === 'cancelled' ? '⏹️' : 
                         status === 'skipped' ? '⏭️' : '🔄';
            
            statusReport += `- ${emoji} **${check.name}**: ${status}\n`;
            
            if (status !== 'success' && status !== 'skipped') {
              allPassed = false;
            }
          }
          
          statusReport += `\n**Overall Status**: ${allPassed ? '✅ All workflows passing' : '❌ Some workflows failed'}`;
          
          console.log(statusReport);
          
          // If this is a PR, add a comment
          if (context.eventName === 'pull_request') {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner,
              repo,
              body: statusReport
            });
          }
          
          // Don't fail the workflow, just report status
          console.log(`Workflow check completed. All passed: ${allPassed}`);

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [check-workflows]

    steps:
    - name: Generate summary
      run: |
        echo "## 📊 Workflow Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.check-workflows.result }}" == "success" ]; then
          echo "✅ **Status**: All workflows completed successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status**: Some workflows failed or are pending" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
        echo "- [Repository Actions](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY
        echo "- [This Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "- [Pull Request #${{ github.event.number }}](https://github.com/${{ github.repository }}/pull/${{ github.event.number }})" >> $GITHUB_STEP_SUMMARY
        fi
