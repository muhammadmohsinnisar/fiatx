name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew test

    - name: Run lint
      run: ./gradlew lintDebug

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Comment PR with APK
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Get APK file info
          const apkPath = 'app/build/outputs/apk/debug/app-debug.apk';
          const stats = fs.statSync(apkPath);
          const fileSizeInMB = (stats.size / (1024 * 1024)).toFixed(2);
          
          // Create comment body
          const body = `## 📱 PR Build Ready!
          
          **APK Information:**
          - **Size:** ${fileSizeInMB} MB
          - **Build:** Debug
          - **Branch:** ${{ github.head_ref }}
          - **Commit:** ${{ github.sha }}
          
          **Quick Install:**
          \`\`\`bash
          # Download and install
          gh run download ${{ github.run_id }} --name debug-apk
          adb install -r app-debug.apk
          \`\`\`
          
          **Changes in this PR:**
          - ✅ Tests passed
          - ✅ Lint checks passed  
          - ✅ Build successful
          
          Ready for review! 🚀`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Upload PR APK
      uses: actions/upload-artifact@v3
      with:
        name: pr-apk-${{ github.event.number }}
        path: app/build/outputs/apk/debug/app-debug.apk

  size-check:
    name: APK Size Check
    runs-on: ubuntu-latest
    needs: pr-validation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y bc
      
    - name: Check APK size
      run: |
        APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk)
        APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1024 / 1024" | bc)
        echo "APK_SIZE_MB=$APK_SIZE_MB" >> $GITHUB_ENV
        
        # Set size limit (20MB)
        SIZE_LIMIT=20
        if (( $(echo "$APK_SIZE_MB > $SIZE_LIMIT" | bc -l) )); then
          echo "❌ APK size ($APK_SIZE_MB MB) exceeds limit ($SIZE_LIMIT MB)"
          exit 1
        else
          echo "✅ APK size ($APK_SIZE_MB MB) is within limit ($SIZE_LIMIT MB)"
        fi

    - name: Comment APK size
      uses: actions/github-script@v6
      with:
        script: |
          const apkSize = process.env.APK_SIZE_MB;
          const sizeLimit = 20;
          const isWithinLimit = parseFloat(apkSize) <= sizeLimit;
          const emoji = isWithinLimit ? '✅' : '❌';
          const status = isWithinLimit ? 'within limit' : 'exceeds limit';
          
          const body = `## 📊 APK Size Report
          
          **Release APK Size:** ${apkSize} MB ${emoji}
          **Status:** ${status} (limit: ${sizeLimit} MB)
          
          ${isWithinLimit ? 
            '🎉 Great! The APK size is optimized.' : 
            '⚠️ Consider optimizing resources or enabling ProGuard/R8.'
          }`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
