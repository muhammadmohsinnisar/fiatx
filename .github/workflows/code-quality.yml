name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  detekt:
    name: Detekt Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Detekt
      run: ./gradlew detekt
      continue-on-error: true

    - name: Upload Detekt results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: detekt-results
        path: |
          app/build/reports/detekt/
          build/reports/detekt/

    - name: Annotate PR with Detekt results
      uses: github/super-linter/slim@v4
      if: github.event_name == 'pull_request'
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_KOTLIN: true
        VALIDATE_KOTLIN_DETEKT: true

  ktlint:
    name: Ktlint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Ktlint
      run: ./gradlew ktlintCheck
      continue-on-error: true

    - name: Upload Ktlint results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ktlint-results
        path: app/build/reports/ktlint/

  complexity-analysis:
    name: Complexity Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate complexity report
      run: |
        # Count lines of code
        echo "## 📊 Code Metrics" > complexity-report.md
        echo "" >> complexity-report.md
        
        # Kotlin files
        KOTLIN_FILES=$(find . -name "*.kt" -not -path "./build/*" | wc -l)
        KOTLIN_LINES=$(find . -name "*.kt" -not -path "./build/*" -exec wc -l {} + | tail -1 | awk '{print $1}')
        
        # XML files
        XML_FILES=$(find . -name "*.xml" -not -path "./build/*" | wc -l)
        XML_LINES=$(find . -name "*.xml" -not -path "./build/*" -exec wc -l {} + | tail -1 | awk '{print $1}')
        
        echo "### 📈 Code Statistics" >> complexity-report.md
        echo "- **Kotlin Files:** $KOTLIN_FILES" >> complexity-report.md
        echo "- **Kotlin Lines:** $KOTLIN_LINES" >> complexity-report.md
        echo "- **XML Files:** $XML_FILES" >> complexity-report.md
        echo "- **XML Lines:** $XML_LINES" >> complexity-report.md
        echo "" >> complexity-report.md
        
        # Method count
        METHOD_COUNT=$(grep -r "fun " --include="*.kt" . | wc -l)
        CLASS_COUNT=$(grep -r "class " --include="*.kt" . | wc -l)
        
        echo "### 🏗️ Structure" >> complexity-report.md
        echo "- **Classes:** $CLASS_COUNT" >> complexity-report.md
        echo "- **Methods:** $METHOD_COUNT" >> complexity-report.md
        echo "" >> complexity-report.md
        
        # Generate timestamp
        echo "**Generated:** $(date)" >> complexity-report.md

    - name: Upload complexity report
      uses: actions/upload-artifact@v3
      with:
        name: complexity-report
        path: complexity-report.md

    - name: Comment complexity on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('complexity-report.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests with coverage
      run: ./gradlew testDebugUnitTestCoverage

    - name: Generate coverage report
      run: ./gradlew jacocoTestReport

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          app/build/reports/jacoco/
          app/build/reports/coverage/
