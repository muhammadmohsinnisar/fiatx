name: Performance Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every day at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  apk-analysis:
    name: APK Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build release APK
      run: ./gradlew assembleRelease

    - name: Analyze APK
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
        
        # APK size analysis
        APK_SIZE=$(stat -c%s "$APK_PATH")
        APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1024 / 1024" | bc)
        
        # Method count using dexdump
        DEX_FILE=$(unzip -l "$APK_PATH" | grep "classes.dex" | awk '{print $4}')
        unzip -q "$APK_PATH" "$DEX_FILE"
        
        # Create analysis report
        echo "# 📊 APK Performance Analysis" > apk-analysis.md
        echo "" >> apk-analysis.md
        echo "## 📦 Size Metrics" >> apk-analysis.md
        echo "- **APK Size:** ${APK_SIZE_MB} MB" >> apk-analysis.md
        echo "- **Size Limit:** 20 MB" >> apk-analysis.md
        
        if (( $(echo "$APK_SIZE_MB > 20" | bc -l) )); then
          echo "- **Status:** ❌ Exceeds recommended size" >> apk-analysis.md
        else
          echo "- **Status:** ✅ Within recommended size" >> apk-analysis.md
        fi
        
        echo "" >> apk-analysis.md
        echo "## 🏗️ Build Information" >> apk-analysis.md
        echo "- **Build Type:** Release" >> apk-analysis.md
        echo "- **Min SDK:** 24 (Android 7.0)" >> apk-analysis.md
        echo "- **Target SDK:** 35 (Android 15)" >> apk-analysis.md
        echo "- **Architecture:** Universal" >> apk-analysis.md
        echo "" >> apk-analysis.md
        echo "**Generated:** $(date)" >> apk-analysis.md

    - name: Upload APK analysis
      uses: actions/upload-artifact@v3
      with:
        name: apk-analysis
        path: apk-analysis.md

    - name: Comment APK analysis on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const analysis = fs.readFileSync('apk-analysis.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: analysis
          });

  build-performance:
    name: Build Performance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Measure build performance
      run: |
        echo "# ⚡ Build Performance Report" > build-performance.md
        echo "" >> build-performance.md
        
        # Clean build timing
        echo "## 🧹 Clean Build" >> build-performance.md
        START_TIME=$(date +%s)
        ./gradlew clean assembleDebug --profile
        END_TIME=$(date +%s)
        CLEAN_BUILD_TIME=$((END_TIME - START_TIME))
        echo "- **Duration:** ${CLEAN_BUILD_TIME}s" >> build-performance.md
        
        # Incremental build timing
        echo "" >> build-performance.md
        echo "## 🔄 Incremental Build" >> build-performance.md
        START_TIME=$(date +%s)
        ./gradlew assembleDebug --profile
        END_TIME=$(date +%s)
        INCREMENTAL_BUILD_TIME=$((END_TIME - START_TIME))
        echo "- **Duration:** ${INCREMENTAL_BUILD_TIME}s" >> build-performance.md
        
        echo "" >> build-performance.md
        echo "## 📈 Performance Metrics" >> build-performance.md
        echo "- **Clean Build:** ${CLEAN_BUILD_TIME}s" >> build-performance.md
        echo "- **Incremental Build:** ${INCREMENTAL_BUILD_TIME}s" >> build-performance.md
        echo "- **Improvement:** $((CLEAN_BUILD_TIME - INCREMENTAL_BUILD_TIME))s faster" >> build-performance.md
        
        # Build scan
        if [ -f "build/reports/profile/profile-*.html" ]; then
          echo "- **Build Profile:** Available in artifacts" >> build-performance.md
        fi
        
        echo "" >> build-performance.md
        echo "**Generated:** $(date)" >> build-performance.md

    - name: Upload build performance report
      uses: actions/upload-artifact@v3
      with:
        name: build-performance
        path: |
          build-performance.md
          build/reports/profile/

  memory-analysis:
    name: Memory Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Analyze memory usage
      run: |
        echo "# 🧠 Memory Analysis Report" > memory-analysis.md
        echo "" >> memory-analysis.md
        
        # Build with memory profiling
        ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2g -XX:+HeapDumpOnOutOfMemoryError"
        
        echo "## 📊 Build Memory Usage" >> memory-analysis.md
        echo "- **Max Heap:** 2GB" >> memory-analysis.md
        echo "- **Status:** ✅ Build completed successfully" >> memory-analysis.md
        
        # Check for potential memory issues
        if grep -r "OutOfMemoryError" build/; then
          echo "- **Memory Issues:** ❌ Found potential memory problems" >> memory-analysis.md
        else
          echo "- **Memory Issues:** ✅ No memory problems detected" >> memory-analysis.md
        fi
        
        echo "" >> memory-analysis.md
        echo "## 🔍 Recommendations" >> memory-analysis.md
        echo "- Use R8/ProGuard for release builds" >> memory-analysis.md
        echo "- Optimize image resources" >> memory-analysis.md
        echo "- Remove unused dependencies" >> memory-analysis.md
        echo "- Use vector drawables when possible" >> memory-analysis.md
        
        echo "" >> memory-analysis.md
        echo "**Generated:** $(date)" >> memory-analysis.md

    - name: Upload memory analysis
      uses: actions/upload-artifact@v3
      with:
        name: memory-analysis
        path: memory-analysis.md
