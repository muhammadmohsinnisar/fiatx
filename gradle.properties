# FiatX - Production Gradle Configuration
# Optimized for performance and build efficiency

# ===== JVM SETTINGS =====
# Increased memory for better build performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ===== GRADLE DAEMON =====
# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# ===== PARALLEL BUILDS =====
# Enable parallel execution for faster builds
org.gradle.parallel=true

# ===== BUILD CACHE =====
# Enable build cache for faster incremental builds
org.gradle.caching=true

# ===== CONFIGURATION ON DEMAND =====
# Only configure projects that are needed
org.gradle.configureondemand=true

# ===== ANDROID SETTINGS =====
# AndroidX package structure
android.useAndroidX=true

# Enable R8 full mode for better optimization
android.enableR8.fullMode=true

# Enable non-transitive R classes for smaller APK
android.nonTransitiveRClass=true

# Enable incremental annotation processing
kapt.incremental.apt=true

# Use worker API for kapt
kapt.use.worker.api=true

# Include compile classpath in kapt
kapt.include.compile.classpath=false

# ===== KOTLIN SETTINGS =====
# Official Kotlin code style
kotlin.code.style=official

# Enable incremental compilation
kotlin.incremental=true

# Use parallel compilation
kotlin.parallel.tasks.in.project=true

# ===== BUILD OPTIMIZATION =====
# Enable build features optimization (using modern approach)
# android.defaults.buildfeatures.buildconfig=true
# android.defaults.buildfeatures.aidl=false
# android.defaults.buildfeatures.renderscript=false
# android.defaults.buildfeatures.resvalues=false
# android.defaults.buildfeatures.shaders=false

# ===== PUBLISHING =====
# Enable publishing for package distribution
android.enableJetifier=true

# ===== SECURITY =====
# Disable HTTP repositories (use HTTPS only)
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000